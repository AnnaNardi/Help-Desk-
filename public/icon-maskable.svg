<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Maskable PWA icon with full bleed safe area (central 80% contains content) -->
  <defs>
    <linearGradient id="ci-maskable-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="mask-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Full background bleed for maskable -->
  <rect width="512" height="512" fill="url(#ci-maskable-grad)" />

  <!-- Inner safe-area group (centered inside safe zone r=205) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Clipboard sheet -->
    <rect x="96" y="80" width="320" height="352" rx="36" fill="#1E3A8A" fill-opacity="0.65" stroke="url(#mask-accent)" stroke-width="10" />
    <rect x="186" y="56" width="140" height="48" rx="16" fill="#FFFFFF" />
    <circle cx="256" cy="72" r="10" fill="#2563EB" />

    <!-- C -->
    <path d="M 230 190 C 160 190, 140 230, 140 280 C 140 330, 160 370, 230 370 C 255 370, 275 360, 285 350" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- I -->
    <line x1="335" y1="190" x2="335" y2="370" 
          stroke="url(#mask-accent)" 
          stroke-width="36" 
          stroke-linecap="round" />
    <circle cx="335" cy="148" r="18" fill="url(#mask-accent)" />
  </g>
</svg>
