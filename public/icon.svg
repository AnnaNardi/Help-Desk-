<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ci-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#ci-grad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="6" />

  <!-- Monogram CI + Help Desk icon elements -->
  <g filter="url(#shadow)">
    <!-- Clipboard/Ticket outline back element -->
    <rect x="96" y="80" width="320" height="352" rx="36" fill="#1E40AF" fill-opacity="0.55" stroke="url(#accent-grad)" stroke-width="8" />
    
    <!-- Top clip bar -->
    <rect x="186" y="56" width="140" height="48" rx="16" fill="#FFFFFF" />
    <circle cx="256" cy="72" r="10" fill="#2563EB" />

    <!-- 'C' letter -->
    <path d="M 230 190 C 160 190, 140 230, 140 280 C 140 330, 160 370, 230 370 C 255 370, 275 360, 285 350" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- 'I' letter with tech badge styling -->
    <line x1="335" y1="190" x2="335" y2="370" 
          stroke="url(#accent-grad)" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- Head of I / dot indicator -->
    <circle cx="335" cy="148" r="18" fill="url(#accent-grad)" />

    <!-- Subtitle mini badge for Desk/TI -->
    <g transform="translate(196, 396)">
      <rect x="0" y="0" width="120" height="24" rx="8" fill="#FFFFFF" fill-opacity="0.9" />
      <text x="60" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#1D4ED8" text-anchor="middle" letter-spacing="2">HELP DESK</text>
    </g>
  </g>
</svg>
